# Configuracion base del backend (tarea 2.1).
# Perfil por defecto: dev (Atlas). Perfil local: replica set rs0 en localhost.
# La cadena de Atlas lleva contrasena: va en el archivo .env, nunca en el repositorio.

spring:
  application:
    name: helpdesk

  # Lee backend/.env si existe (formato KEY=valor). El archivo esta en .gitignore.
  config:
    import: optional:file:.env[.properties]

  profiles:
    default: dev

  # Spring Boot 4 movio la conexion de spring.data.mongodb.* a spring.mongodb.*
  mongodb:
    uri: ${MONGODB_URI}
    database: helpdesk

  # Cachés de la sesión (acta 2.4): usuario y rol leídos para armar los permisos efectivos.
  # Los servicios las vacían al cambiar un usuario o un rol; los 10 minutos son una red de seguridad.
  cache:
    type: caffeine
    cache-names: usuariosSesion,rolesSesion
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=10m

  # Lo que es propio de Spring Data sigue en spring.data.mongodb.*
  data:
    mongodb:
      # Los indices los crea solo database/indices/00_indices.js (contexto 6.2).
      auto-index-creation: false

server:
  port: 8080

# Seguridad (tarea 2.4). JWT firmado con HS256.
# JWT_SECRET: 32 bytes aleatorios en Base64, en el archivo .env (ver .env.example).
helpdesk:
  jwt:
    secreto: ${JWT_SECRET}
    vida-access-token: 15m
    vida-refresh-token: 7d
    # Secure en la cookie del refresh token. Los navegadores la aceptan en http://localhost.
    cookie-segura: true
  # Límite de intentos fallidos en el login (acta 2.4).
  login:
    max-fallos-correo: 5
    max-fallos-ip: 20
    ventana: 15m
  # Orígenes del frontend que pueden llamar a la API desde otro origen, separados por comas.
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:5173}
  # Embeddings de la base de conocimientos (tarea 2.7). GEMINI_API_KEY va en el archivo .env.
  # Sin clave el backend arranca igual: los artículos quedan con el vector pendiente y la búsqueda
  # por significado responde con la de texto.
  gemini:
    clave: ${GEMINI_API_KEY:}
    url-base: https://generativelanguage.googleapis.com/v1beta
    tiempo-conexion: 5s
    tiempo-respuesta: 10s
    # Tarea programada que genera los vectores pendientes, en lotes para no pasar de la cuota gratuita.
    regeneracion-activa: true
    intervalo-regeneracion: PT10M
    lote-regeneracion: 10
