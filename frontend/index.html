<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4338CA" />
    <title>Helpdesk · Sistemas Integrados</title>
    <script>
      // Aplica el tema antes de pintar, para que no parpadee (ver src/lib/tema.ts).
      try {
        var t = localStorage.getItem('helpdesk.tema')
        if (t !== 'claro' && t !== 'oscuro') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        }
        document.documentElement.dataset.tema = t
      } catch (e) {
        document.documentElement.dataset.tema = 'claro'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
